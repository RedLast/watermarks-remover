services:
  - type: web
    name: watermarks-remover
    runtime: python
    plan: free                    # Make sure this is still here!
    startCommand: python service/scripts/server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: WATERMARKS_SERVER_API_KEY
        generateValue: true