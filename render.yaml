services:
  - type: web
    name: watermarks-remover
    runtime: docker
    plan: free
    dockerfilePath: ./service/Dockerfile
    dockerContext: ./service
    autoDeploy: true
    envVars:
      - key: WATERMARKS_SERVER_API_KEY
        generateValue: true
      - key: WATERMARKS_SERVER_PORT
        value: "10000"